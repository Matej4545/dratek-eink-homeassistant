send_text:
  name: Send text
  description: Render centered text and send it to a DRATEK eInk label over BLE.
  fields:
    address:
      name: BLE address
      description: BLE MAC address of the label.
      required: true
      example: "FF:FF:94:20:10:78"
      selector:
        text:
    sdk_type:
      name: SDK type
      description: Display SDK type, for example 75 for 400x300 BWR or 267 for 250x122 BWR.
      required: true
      example: 75
      selector:
        number:
          min: 1
          max: 5000
          mode: box
    text:
      name: Text
      description: Text to render.
      required: true
      example: "Hello from HA"
      selector:
        text:
    font_size:
      name: Font size
      description: Optional font size in pixels.
      required: false
      selector:
        number:
          min: 8
          max: 200
          mode: box
    color:
      name: Color
      description: Text color.
      required: false
      default: black
      selector:
        select:
          options:
            - black
            - red

set_display_automation:
  name: Set display automation
  description: Update an existing automatic refresh configuration for one DRATEK eInk display.
  fields:
    address:
      name: BLE address
      description: BLE MAC address of the display whose automation should be updated.
      required: true
      example: "FF:FF:94:20:10:78"
      selector:
        text:
    enabled:
      name: Enabled
      description: Enable or pause automatic refresh for this display.
      required: false
      selector:
        boolean:
    refresh_interval_seconds:
      name: Refresh interval
      description: Automatic refresh interval in seconds.
      required: false
      selector:
        number:
          min: 30
          max: 86400
          mode: box
    refresh_trigger_mode:
      name: Refresh trigger mode
      description: Choose whether refreshes are triggered by state changes, interval, or both.
      required: false
      selector:
        select:
          options:
            - both
            - change_only
            - interval_only
    always_send:
      name: Always send
      description: Send the frame even when the rendered image has not changed.
      required: false
      selector:
        boolean:
    request_refresh:
      name: Request refresh now
      description: Queue an immediate refresh after applying the requested settings.
      required: false
      default: false
      selector:
        boolean:

set_display_layer:
  name: Set display layer
  description: Save, activate, or delete a named automation layer for one display.
  fields:
    address:
      name: BLE address
      description: BLE MAC address of the display.
      required: true
      example: "FF:FF:94:20:10:78"
      selector:
        text:
    action:
      name: Action
      description: Layer operation to perform.
      required: true
      selector:
        select:
          options:
            - save_current
            - activate
            - delete
    layer:
      name: Layer name
      description: Name of the saved screen layer.
      required: true
      example: "night_mode"
      selector:
        text:
    request_refresh:
      name: Request refresh now
      description: For activate action, queue an immediate refresh after switching the layer.
      required: false
      default: false
      selector:
        boolean:

show_image:
  name: Show image
  description: >-
    Put any picture on a display - a file, a URL, a camera snapshot or base64 data. It is fitted
    to the panel, reduced to the panel's colours and sent through the usual route (Bluetooth or
    an ESP32 gateway). Skipped when the display already shows exactly this picture. Pauses the
    display's automatic refresh so it does not paint over the picture.
  fields:
    address:
      name: BLE address
      description: BLE MAC address of the display.
      required: true
      example: "FF:FF:94:20:10:78"
      selector:
        text:
    image:
      name: Image file
      description: >-
        Path to an image file (relative paths are under /config). Must be in an allowed directory:
        /config/www and /media are allowed by default, others via allowlist_external_dirs.
      required: false
      example: "www/eink/weather.png"
      selector:
        text:
    url:
      name: Image URL
      description: http(s) URL of an image.
      required: false
      example: "http://192.168.1.10:8000/screen.png"
      selector:
        text:
    camera_entity:
      name: Camera
      description: Camera entity whose current snapshot is shown.
      required: false
      selector:
        entity:
          domain: camera
    data:
      name: Base64 data
      description: Image bytes as base64 or a data URL (for scripts that render in memory).
      required: false
      selector:
        text:
          multiline: true
    sdk_type:
      name: SDK type
      description: >-
        Override the display type. Normally detected from the display's advertisement;
        46 is the 2.9" 296x128 BWRY label.
      required: false
      selector:
        number:
          min: 1
          max: 5000
          mode: box
    fit:
      name: Fit
      description: >-
        How a picture of another size is fitted. contain = scale to fit with white margins,
        cover = scale and crop, stretch = distort, none = refuse anything but the exact size.
      required: false
      default: contain
      selector:
        select:
          options: [contain, cover, stretch, none]
    orientation:
      name: Orientation
      description: auto uses portrait for pictures taller than wide.
      required: false
      default: auto
      selector:
        select:
          options: [auto, landscape, portrait]
    dither:
      name: Dither
      description: >-
        ordered = stable patterns for greys and in-between colours (best for UIs),
        floyd = smoother for photos, none = nearest colour, threshold = the integration's
        older black/white/red cut-off.
      required: false
      default: ordered
      selector:
        select:
          options: [ordered, floyd, none, threshold]
    transform:
      name: Transform
      description: Override the display mapping saved in the panel for this display.
      required: false
      selector:
        select:
          options: [rotate_cw, rotate_ccw, rotate_cw_flip_lr, rotate_cw_flip_tb, rotate_ccw_flip_lr, rotate_ccw_flip_tb, none, rotate_180, flip_lr, flip_tb]
    force:
      name: Force
      description: Send even if the display already shows this picture.
      required: false
      default: false
      selector:
        boolean:
    pause_automation:
      name: Pause automatic refresh
      description: >-
        Pause (not delete) the display's automatic refresh configured in the panel, so its
        next tick does not overwrite the picture. Resumed automatically if the send fails
        (only when wait is on - with wait off the outcome is not known to the service).
      required: false
      default: true
      selector:
        boolean:
    wait:
      name: Wait for the display
      description: >-
        Wait until the transfer finishes, so errors are reported. Off = queue and return at once;
        the response then says queued, and failures only show in the panel's queue.
      required: false
      default: true
      selector:
        boolean:

set_screen:
  name: Set screen
  description: >-
    Choose what a display shows: a screen (a Python file from the integration's bundled screens
    or /config/dratek_screens) that Home Assistant renders and redraws whenever the entities it
    reads change. "off" stops it. The same choice is the display's "Obrazovka" select entity.
  fields:
    address:
      name: BLE address
      description: BLE MAC address of the display.
      required: true
      example: "FF:FF:94:20:10:78"
      selector:
        text:
    screen:
      name: Screen
      description: Screen id (file name without .py), or "off".
      required: true
      example: mini_weather
      selector:
        text:
    options:
      name: Options
      description: >-
        Settings for this screen on this display, merged into the stored ones. Each screen lists
        its options and defaults; the select entity shows them as attributes.
      required: false
      example: '{"weather": "weather.forecast_home"}'
      selector:
        object:
    reset_options:
      name: Reset options
      description: Drop this screen's stored options first (back to its defaults).
      required: false
      default: false
      selector:
        boolean:
    min_refresh_seconds:
      name: Minimum refresh gap
      description: >-
        Never rewrite the panel more often than this (default 600 s). Each write costs battery
        on coin-cell labels; changes in between are drawn at the end of the gap, not dropped.
      required: false
      selector:
        number:
          min: 30
          max: 86400
          unit_of_measurement: s
          mode: box

refresh_screen:
  name: Refresh screen
  description: Redraw a display's screen now.
  fields:
    address:
      name: BLE address
      description: BLE MAC address of the display.
      required: true
      example: "FF:FF:94:20:10:78"
      selector:
        text:
    force:
      name: Force
      description: Ignore the minimum refresh gap and send even an identical picture.
      required: false
      default: true
      selector:
        boolean:

reload_screens:
  name: Reload screens
  description: Re-read the screen files (after you edit or add one in /config/dratek_screens) and redraw.

find_transit_stop:
  name: Find transit stop
  description: Search Czech/Slovak public-transport stops; returns ids to use as a departures screen's stop_id.
  fields:
    query:
      name: Stop name
      description: Part of the stop's name.
      required: true
      example: Letňany
      selector:
        text:
    limit:
      name: Results
      required: false
      default: 8
      selector:
        number:
          min: 1
          max: 12
