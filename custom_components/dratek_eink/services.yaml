send_text:
  name: Send text
  description: Render centered text and send it to a DRATEK eInk label over BLE.
  fields:
    address:
      name: BLE address
      description: BLE MAC address of the label.
      required: true
      example: "FF:FF:94:20:10:78"
      selector:
        text:
    sdk_type:
      name: SDK type
      description: Display SDK type, for example 75 for 400x300 BWR or 267 for 250x122 BWR.
      required: true
      example: 75
      selector:
        number:
          min: 1
          max: 5000
          mode: box
    text:
      name: Text
      description: Text to render.
      required: true
      example: "Hello from HA"
      selector:
        text:
    font_size:
      name: Font size
      description: Optional font size in pixels.
      required: false
      selector:
        number:
          min: 8
          max: 200
          mode: box
    color:
      name: Color
      description: Text color.
      required: false
      default: black
      selector:
        select:
          options:
            - black
            - red

set_display_automation:
  name: Set display automation
  description: Update an existing automatic refresh configuration for one DRATEK eInk display.
  fields:
    address:
      name: BLE address
      description: BLE MAC address of the display whose automation should be updated.
      required: true
      example: "FF:FF:94:20:10:78"
      selector:
        text:
    enabled:
      name: Enabled
      description: Enable or pause automatic refresh for this display.
      required: false
      selector:
        boolean:
    refresh_interval_seconds:
      name: Refresh interval
      description: Automatic refresh interval in seconds.
      required: false
      selector:
        number:
          min: 30
          max: 86400
          mode: box
    refresh_trigger_mode:
      name: Refresh trigger mode
      description: Choose whether refreshes are triggered by state changes, interval, or both.
      required: false
      selector:
        select:
          options:
            - both
            - change_only
            - interval_only
    always_send:
      name: Always send
      description: Send the frame even when the rendered image has not changed.
      required: false
      selector:
        boolean:
    request_refresh:
      name: Request refresh now
      description: Queue an immediate refresh after applying the requested settings.
      required: false
      default: false
      selector:
        boolean:
